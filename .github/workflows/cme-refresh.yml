name: CME vol yüzeyi (günlük)
run-name: ${{ inputs.request_id || format('scheduled-{0}-XAU-XAG', github.run_id) }}
concurrency:
  group: cme-refresh-engine
  cancel-in-progress: false

# Eski IV yenileme yolu: 17:00–19:00 UTC'deki metal settlement'larını kullanır;
# bu erken kayıtlar preliminary olabilir. 12:00 UTC (TR 15:00) kesin final garantisi değildir.
# Final faiz/taşıma girdileri, bayrak ve seans kontrolüyle cme-curves.yml'de ayrı toplanır.
# İki yol henüz aynı fiyatlama sürümüne bağlanmadı; eski yüzey banka kira eğrisi değildir.
on:
  schedule:
    - cron: '0 12 * * 1-6'
  workflow_dispatch:        # panelden elle de tetiklenebilir
    inputs:
      date:
        description: 'Belirli bir settlement günü (YYYY-MM-DD) — boş bırakılırsa otomatik'
        required: false
      product:
        description: 'Ürün (boş = XAU ve XAG birlikte)'
        required: false
      request_id:
        description: 'Uygulamanın takip numarası'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # iş ~3 dk; Databento yavaşlarsa pay olsun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Ürün belirtilmezse ALTIN VE GÜMÜŞ ayrı ayrı yenilenir. Biri hata verse bile diğeri
      # denenir; en az bir ürün hata verirse iş başarısız olur.
      - name: Yüzeyi yenile
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PRODUCTS: ${{ github.event.inputs.product || 'XAU XAG' }}
          DATE_ARG: ${{ github.event.inputs.date && format('--date={0}', github.event.inputs.date) || '' }}
        run: |
          failed=0
          for p in $PRODUCTS; do
            echo "::group::$p"
            if ! npm run refresh:cme -- --product=$p $DATE_ARG; then failed=1; echo "::warning::$p yenilenemedi"; fi
            echo "::endgroup::"
          done
          [ "$failed" = "0" ] || { echo "::error::en az bir ürün yenilenemedi"; exit 1; }
