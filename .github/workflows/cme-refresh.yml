name: CME vol yüzeyi (günlük)

# COMEX metalleri ~13:25 CT'de settle olur ancak Databento veriyi ertesi gün
# TR saatiyle 15:00 (12:00 UTC) civarında yayınlıyor. Bu yüzden garantili olması
# adına cron 12:00 UTC'de çalışır. Cuma gününün verisi Cumartesi yayınlanacağı
# için cron Pazartesi-Cumartesi arası (1-6) ayarlanmıştır.
on:
  schedule:
    - cron: '0 12 * * 1-6'
  workflow_dispatch:        # panelden elle de tetiklenebilir
    inputs:
      date:
        description: 'Belirli bir settlement günü (YYYY-MM-DD) — boş bırakılırsa otomatik'
        required: false
      product:
        description: 'Ürün (boş = XAU ve XAG birlikte)'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # iş ~3 dk; Databento yavaşlarsa pay olsun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Ürün belirtilmezse ALTIN VE GÜMÜŞ ayrı ayrı yenilenir. Biri hata verirse (ör. o gün
      # settlement yok) diğeri yine de denenir; adım sonunda hepsi başarısızsa iş kırmızı olur.
      - name: Yüzeyi yenile
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PRODUCTS: ${{ github.event.inputs.product || 'XAU XAG' }}
          DATE_ARG: ${{ github.event.inputs.date && format('--date={0}', github.event.inputs.date) || '' }}
        run: |
          ok=0
          for p in $PRODUCTS; do
            echo "::group::$p"
            if npm run refresh:cme -- --product=$p $DATE_ARG; then ok=1; else echo "::warning::$p yenilenemedi"; fi
            echo "::endgroup::"
          done
          [ "$ok" = "1" ] || { echo "::error::hiçbir ürün yenilenemedi"; exit 1; }
