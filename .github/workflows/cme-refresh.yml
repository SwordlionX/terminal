name: CME vol yüzeyi (günde 3 deneme)
run-name: ${{ inputs.request_id || format('scheduled-{0}-XAU-XAG', github.run_id) }}
concurrency:
  group: cme-refresh-engine
  cancel-in-progress: false

# Only final publication flags and complete provider coverage can activate a bundle.
# Scheduling becomes active only when this workflow reaches the repository default branch.
on:
  schedule:
    # Finals usually land ~23:35 UTC. Standard window closes 04:00 UTC next day, the extended one
    # 16:00 UTC next business day; three tries absorb late publications and GitHub's cron delays.
    # An up-to-date bundle is detected and skipped without a paid download.
    - cron: '15 5 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '30 18 * * 1-5'
  workflow_dispatch: # panelden elle de tetiklenebilir
    inputs:
      date:
        description: 'Belirli bir settlement günü (YYYY-MM-DD) — boş bırakılırsa otomatik'
        required: false
      product:
        description: 'İstek ürünü; eğri sürümü daima XAU ve XAG birlikte yenilenir'
        required: false
      request_id:
        description: 'Uygulamanın takip numarası'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Extra time outside the data step for setup, cleanup and cache save.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache/restore@v4
        id: cme-cache
        with:
          # Keep this whole-directory path/key compatible with existing paid-data/budget caches.
          path: ~/.cache/terminal-x/databento-audit
          key: cme-curve-budget-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cme-curve-budget-
      - name: Eski önbelleğin sahipsiz geçici dosyalarını temizle
        run: node scripts/clean-cme-cache.cjs
      - name: Final futures, USD ve iki IV yüzeyini birlikte kur
        timeout-minutes: 40
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          SESSION_DATE: ${{ inputs.date }}
        run: |
          args=(--write)
          if [ -n "$SESSION_DATE" ]; then args+=("--date=$SESSION_DATE"); fi
          npm run collect:cme:curves -- "${args[@]}"
          npm run refresh:cme -- "${args[@]}"
      - name: Yarım dosyaları kalıcı önbellekten çıkar
        if: always() && steps.cme-cache.outcome == 'success'
        run: node scripts/clean-cme-cache.cjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/terminal-x/databento-audit
          key: cme-curve-budget-${{ github.run_id }}-${{ github.run_attempt }}
