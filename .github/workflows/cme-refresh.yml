name: CME vol yüzeyi (günlük)
run-name: ${{ inputs.request_id || format('scheduled-{0}-XAU-XAG', github.run_id) }}
concurrency:
  group: cme-refresh-engine
  cancel-in-progress: false

# Only final publication flags and complete provider coverage can activate a bundle.
# Scheduling becomes active only when this workflow reaches the repository default branch.
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:        # panelden elle de tetiklenebilir
    inputs:
      date:
        description: 'Belirli bir settlement günü (YYYY-MM-DD) — boş bırakılırsa otomatik'
        required: false
      product:
        description: 'İstek ürünü; eğri sürümü daima XAU ve XAG birlikte yenilenir'
        required: false
      request_id:
        description: 'Uygulamanın takip numarası'
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # iş ~3 dk; Databento yavaşlarsa pay olsun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/terminal-x/databento-audit
          key: cme-curve-budget-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cme-curve-budget-
      - name: Final futures, USD ve iki IV yüzeyini birlikte kur
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          SESSION_DATE: ${{ inputs.date }}
        run: |
          args=(--write)
          if [ -n "$SESSION_DATE" ]; then args+=("--date=$SESSION_DATE"); fi
          npm run collect:cme:curves -- "${args[@]}"
          npm run refresh:cme -- "${args[@]}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/terminal-x/databento-audit
          key: cme-curve-budget-${{ github.run_id }}-${{ github.run_attempt }}
