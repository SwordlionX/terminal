name: CME final faiz ve taşıma girdileri
concurrency:
  group: cme-refresh-engine
  cancel-in-progress: false
on:
  # Manual diagnostics only; cme-refresh.yml owns the daily atomic pricing pipeline.
  workflow_dispatch:
    inputs:
      date:
        description: 'Settlement seansı YYYY-MM-DD (boş = son final seans)'
        required: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: cme-cache
        with:
          # Same paths and key family as the atomic refresh: never start a separate budget ledger.
          path: ~/.cache/terminal-x/databento-audit
          key: cme-curve-budget-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cme-curve-budget-
      - name: Eski önbelleğin sahipsiz geçici dosyalarını temizle
        run: node scripts/clean-cme-cache.cjs
      - name: Final girdileri ayrı snapshot olarak kaydet
        timeout-minutes: 15
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SESSION_DATE: ${{ inputs.date }}
        run: |
          args=(--write)
          if [ -n "$SESSION_DATE" ]; then args+=("--date=$SESSION_DATE"); fi
          npm run collect:cme:curves -- "${args[@]}"
      - name: Yarım dosyaları kalıcı önbellekten çıkar
        if: always() && steps.cme-cache.outcome == 'success'
        run: node scripts/clean-cme-cache.cjs
      # Preserve paid-request reservations even when a download or validation fails.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/terminal-x/databento-audit
          key: cme-curve-budget-${{ github.run_id }}-${{ github.run_attempt }}
